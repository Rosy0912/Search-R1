defaults:
  - ppo_baselines
  - _self_

data:
  train_files: ${baselines.holdout.data_root}/train.parquet
  val_files: ${baselines.holdout.data_root}/validation.parquet
  final_val_files: ${baselines.holdout.data_root}/final.parquet
  train_batch_size: 512
  val_batch_size: 512
  train_data_num: null
  val_data_num: null
  max_prompt_length: 4096
  max_start_length: 2048
  max_response_length: 500
  max_obs_length: 500
actor_rollout_ref:
  model:
    path: ${oc.env:OPSD_E1_OFFICIAL_MODEL}
    enable_gradient_checkpointing: true
  actor:
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: 16
    ppo_epochs: 1
    entropy_coeff: 0
    use_kl_loss: false
    kl_loss_coef: 0
    grad_clip: 1
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 57
      lr_warmup_steps_ratio: 0
      warmup_style: constant
  rollout:
    n_agent: 5
    n: 1
    log_prob_micro_batch_size: 32
    tensor_model_parallel_size: 1
    temperature: 1
    top_p: 1
    top_k: -1
  ref:
    log_prob_micro_batch_size: 32
algorithm:
  kl_ctrl:
    kl_coef: 0
max_turns: 4
force_final_answer: false
retriever:
  url: ${oc.env:OPSD_E1_RETRIEVER_URL,http://127.0.0.1:8000/retrieve}
  topk: 3
trainer:
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 15
  # Dedicated E1 loop terminates on explicit completed actual outer updates.
  total_training_steps: 300
  save_freq: 25
  test_freq: 50
  acceptance_step: 5
  val_before_train: true
  smoke_only: false
  experiment_name: opsd-search-e1-instruct-300
  default_local_dir: ${oc.env:SEARCH_R1_BASELINE_RUN_ROOT}/checkpoints
baselines:
  method: opsd
  seed: 42
  local_runtime_only: true
  local_runtime_host: h100-10
  holdout:
    enabled: true
    input_mode: prebuilt_manifest
    seed: 42
    manifest_path: ${oc.env:OPSD_E1_COMMON_MANIFEST}
    manifest_sha256: 0b002b0038d58d0ce07c073e41a8be785ce47eb4f15a1ee883fe19cc86dbcf24
    data_root: ${oc.env:OPSD_E1_COMMON_DATA_ROOT}
  distillation:
    teacher_path: ${actor_rollout_ref.model.path}
    teacher_device: cuda
    privileged_answers: true
    teacher_prompt_mode: user_context
    beta: 0
    temperature: 1
    component_clip: null
    chunk_size: 16
    loss_checkpointing: true
    max_student_logits_gib: 8.0
  opsd_e1:
    enabled: true
    gate_required: true
    acceptance_step: 5
    stage_files: ${baselines.holdout.data_root}/stage.parquet
    stage_num: 64
    stage_freq: 50
    run_root: ${oc.env:SEARCH_R1_BASELINE_RUN_ROOT}
    train_log_path: ${oc.env:SEARCH_R1_BASELINE_RUN_ROOT}/train.log
    receipt_path: ${oc.env:SEARCH_R1_BASELINE_RUN_ROOT}/acceptance-5-receipt.json
    public_key_path: ${oc.env:OPSD_E1_REVIEW_PUBLIC_KEY}
    public_key_sha256: ${oc.env:OPSD_E1_REVIEW_PUBLIC_KEY_SHA256}
    binding_manifest_path: ${oc.env:OPSD_E1_BINDING_MANIFEST}
    binding_manifest_sha256: ${oc.env:OPSD_E1_BINDING_MANIFEST_SHA256}
