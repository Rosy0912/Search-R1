defaults:
  - ppo_baselines
  - _self_

actor_rollout_ref:
  model:
    path: ${oc.env:TREE_INSTRUCT_MODEL}
  actor:
    training_state_enabled: true
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: 16
    ppo_epochs: 1
    entropy_coeff: 0.0
    grad_clip: 1.0
    clip_ratio: 0.2
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 57
      lr_warmup_steps_ratio: 0.0
      total_training_steps: 300
  rollout:
    n_agent: 2
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.4
    log_prob_micro_batch_size: 32
  ref:
    log_prob_micro_batch_size: 32

data:
  train_batch_size: 512
  val_batch_size: 32
  max_prompt_length: 4096
  max_response_length: 500
  max_start_length: 2048
  max_obs_length: 500
  train_data_num: null
  val_data_num: null

baselines:
  method: tree_grpo
  local_runtime_only: true
  local_runtime_host: h100-9
  bapo:
    stage_validation_size: 64
  holdout:
    input_mode: prebuilt_manifest
    enabled: true
    seed: 42
    manifest_path: ${oc.env:TREE_COMMON_DATA}/manifest.json
    manifest_sha256: 0b002b0038d58d0ce07c073e41a8be785ce47eb4f15a1ee883fe19cc86dbcf24
    data_root: ${oc.env:TREE_COMMON_DATA}

trainer:
  total_training_steps: 301
  actual_update_limit: 300
  total_epochs: 15
  save_freq: 25
  acceptance_step: 5
  training_state_enabled: true
  acceptance_gate_enabled: true
  acceptance_gate_timeout_seconds: 43200
  test_freq: 50
  val_before_train: true
  smoke_only: false
  experiment_name: tree-instruct300
  logger: [console]

max_turns: 4
force_final_answer: false
retriever:
  url: http://127.0.0.1:18082/retrieve
  topk: 3
