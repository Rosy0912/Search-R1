defaults:
  - ppo_baselines
  - _self_

data:
  train_files: ${oc.env:GIGPO_E1_ROOT}/common-data/train.parquet
  val_files: ${oc.env:GIGPO_E1_ROOT}/common-data/validation.parquet
  final_val_files: ${oc.env:GIGPO_E1_ROOT}/common-data/final.parquet
  train_batch_size: 512
  val_batch_size: 32
  train_data_num: null
  val_data_num: null
  max_prompt_length: 4096
  max_start_length: 2048
  max_response_length: 500
  max_obs_length: 500
actor_rollout_ref:
  model:
    path: ${oc.env:GIGPO_E1_ROOT}/assets/qwen2.5-3b-instruct-aa8e725
  actor:
    complete_internal_state: true
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: 16
    ppo_epochs: 1
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    clip_ratio: 0.2
    grad_clip: 1.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 57
      lr_warmup_steps_ratio: 0.0
      total_training_steps: 300
      save_training_state: true
  rollout:
    n_agent: 5
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size: 32
    gpu_memory_utilization: 0.4
  ref:
    model_path: ${actor_rollout_ref.model.path}
    log_prob_micro_batch_size: 32
baselines:
  method: gigpo
  loss_reduction: sequence_mean
  local_runtime_only: true
  local_runtime_host: h100-8
  holdout:
    input_mode: prebuilt_manifest
    enabled: true
    seed: 42
    manifest_path: ${oc.env:GIGPO_E1_ROOT}/common-data/manifest.json
    manifest_sha256: 0b002b0038d58d0ce07c073e41a8be785ce47eb4f15a1ee883fe19cc86dbcf24
    data_root: ${oc.env:GIGPO_E1_ROOT}/common-data
trainer:
  total_training_steps: 300
  total_epochs: 15
  acceptance_step: 5
  save_freq: 25
  test_freq: 50
  val_before_train: true
  smoke_only: false
  experiment_name: gigpo-e1-instruct300-20261004
  resume:
    enabled: false
  instruct300:
    enabled: true
    approval_path: ${oc.env:GIGPO_E1_RUN}/instruct5-approval.json
    wait_seconds: 43200
  logger: [console]
  default_local_dir: ${oc.env:GIGPO_E1_RUN}/checkpoints
max_turns: 4
force_final_answer: false
retriever:
  url: http://127.0.0.1:18081/retrieve
  topk: 3
