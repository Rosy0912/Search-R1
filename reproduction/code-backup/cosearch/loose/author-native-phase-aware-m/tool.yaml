tools:
  - class_name: verl.tools.co_search_tool.CoSearchTool
    config:
      type: native
      retrieval_service_url: "http://127.0.0.1:18086/retrieve"
      timeout: 30
      max_retries: 3
      retry_delay: 1.0
      retry_backoff: 2.0
      default_top_n: 50
      default_top_m: 5
      hit_cutoffs: [1, 3, 5]
      tool_score_metric: "hit"
      trivial_answers: ["yes", "no", "true", "false"]
      format_penalty: -0.2
